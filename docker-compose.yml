services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devtools
      POSTGRES_PASSWORD: devtools
      POSTGRES_DB: devtools
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtools"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
